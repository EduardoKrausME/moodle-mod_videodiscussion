name: Finish Moodle plugin sources

on:
  push:
    branches: [master]
    paths:
      - '.github/workflows/finish-plugin.yml'

permissions:
  contents: write

jobs:
  finish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          path: plugin
          fetch-depth: 0

      - name: Checkout finishing tools
        uses: actions/checkout@v4
        with:
          repository: EduardoKrausME/moodle-plugin-validate
          ref: master
          path: validator
          fetch-depth: 1

      - name: Run finishing pipeline
        id: finishing
        shell: bash
        run: |
          set +e
          python3 validator/.chatgpt/run.py "$GITHUB_WORKSPACE/plugin"
          STATUS=$?
          echo "status=$STATUS" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit deterministic finishing changes
        working-directory: plugin
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No deterministic finishing changes were required."
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Normalize Moodle plugin sources"
            git push origin HEAD:master
          fi

      - name: Fail when validators still report problems
        if: steps.finishing.outputs.status != '0'
        shell: bash
        run: |
          echo "The finishing pipeline reported remaining problems."
          exit 1
